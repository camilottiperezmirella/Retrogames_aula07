
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RetroGames | Jogos Clássicos</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>🎮 RetroGames</h1>
        <p>Reviva a nostalgia dos jogos clássicos!</p>
    </header>

    <main class="container">

        <section class="titulo-secao">
            <div>
                <h2>Nosso Catálogo</h2>
                <p>Explore os clássicos que marcaram gerações.</p>
            </div>

            <button id="btnCadastrar" type="button">
                + Cadastrar Jogo
            </button>
        </section>

        <section
            id="listarJogos"
            class="listar-jogos"
            aria-label="Catálogo de jogos"
        >
            <p id="mensagemVazia">Nenhum jogo cadastrado.</p>
        </section>

    </main>

    <dialog id="modalCadastro">
        <h2>Cadastrar Novo Jogo</h2>

        <form id="formJogo">

            <label for="titulo">Título do jogo</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                placeholder="Ex.: Super Mario World"
                maxlength="150"
                required
            >

            <label for="plataforma">Plataforma</label>
            <input
                type="text"
                id="plataforma"
                name="plataforma"
                placeholder="Ex.: Super Nintendo (SNES)"
                maxlength="80"
                required
            >

            <label for="desenvolvedora">Desenvolvedora</label>
            <input
                type="text"
                id="desenvolvedora"
                name="desenvolvedora"
                placeholder="Ex.: Nintendo"
                maxlength="120"
                required
            >

            <label for="imagem_url">URL da capa do jogo</label>
            <input
                type="url"
                id="imagem_url"
                name="imagem_url"
                placeholder="https://site.com/capa.jpg"
                required
            >

            <label for="preco">Preço (R$)</label>
            <input
                type="number"
                id="preco"
                name="preco"
                min="0.01"
                max="99999999.99"
                step="0.01"
                placeholder="149.90"
                required
            >

            <div class="acoes">
                <button
                    type="button"
                    id="btnCancelar"
                    class="cancelar"
                >
                    Cancelar
                </button>

                <button type="submit">
                    Salvar Jogo
                </button>
            </div>

        </form>
    </dialog>

</body>
</html>
